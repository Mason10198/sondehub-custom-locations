name: Bug report
description: Report a reproducible extension or SondeHub compatibility problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic locations and remove personal coordinates, credentials, and browser-profile data.
  - type: input
    id: version
    attributes:
      label: Extension version or commit
    validations:
      required: true
  - type: input
    id: firefox
    attributes:
      label: Firefox edition, version, and operating system
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: SondeHub host
      options:
        - tracker.sondehub.org
        - sondehub.org
        - amateur.sondehub.org
        - Options page only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant console errors without personal locations or secrets.
