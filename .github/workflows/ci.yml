name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project metadata
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run project checks
        run: npm run lint

      - name: Verify reproducible unsigned XPI
        run: npm run verify:package

      - name: Run Mozilla add-on lint
        run: npx --yes web-ext@latest lint --source-dir . --ignore-files scripts/package.py scripts/verify-package.py
